[package]
name = "brain-anchor"
version = "0.1.0"
edition = "2021"
description = "Copies signed audit batch roots to an append-only file in a separate repository, and checks the live log against it."
publish = false

[dependencies]
ed25519-dalek = { version = "2", features = ["pem"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
