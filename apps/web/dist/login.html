<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Internal Brain</title>
  <script type="module" crossorigin src="/assets/login-z5Q4dXGK.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/styles-2K6hHTkX.js">

<body class="login-page">
  <main class="login-card">
    <p class="eyebrow">ORGANISATION WORKSPACE</p>
    <h1>Sign in to Internal Brain</h1>
    <p>Use the account provided for your organisation.</p>
    <form id="loginForm">
      <label for="loginEmail">Email</label>
      <input id="loginEmail" type="email" autocomplete="username" required>
      <label for="loginPassword">Password</label>
      <input id="loginPassword" type="password" autocomplete="current-password" required>
      <button id="loginSubmit" type="submit">Sign in</button>
    </form>
    <p id="loginStatus" role="status"></p>
  </main>
</body>
</html>
